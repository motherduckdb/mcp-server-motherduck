name: Publish to PyPI and MCP Registry

on:
  workflow_dispatch:  # Allows manual triggering from GitHub Actions UI
    inputs:
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string
  workflow_call:  # Allows triggering from other workflows
    inputs:
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC authentication
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      
      - name: Install dependencies
        run: uv sync --all-extras --dev
      
      - name: Build package
        run: |
          rm -rf dist/
          uv build
      
      - name: Publish to PyPI
        id: pypi-publish
        continue-on-error: true
        run: |
          uv publish --token ${{ secrets.PYPI_TOKEN }} 2>&1 | tee publish_output.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -eq 0 ]; then
            echo "✅ Successfully published to PyPI"
            echo "pypi_status=success" >> $GITHUB_OUTPUT
          elif grep -q "already exists" publish_output.txt || grep -q "File already exists" publish_output.txt; then
            echo "⚠️ Package version already exists on PyPI, skipping..."
            echo "pypi_status=already_exists" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "❌ Failed to publish to PyPI"
            echo "pypi_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
      
      - name: Setup Node.js (for schema validation)
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      
      - name: Install MCP Publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version
      
      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc
      
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher publish 2>&1 | tee mcp_output.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -eq 0 ]; then
            echo "✅ Successfully published to MCP Registry"
          elif grep -q "duplicate version" mcp_output.txt; then
            echo "⚠️ Version already exists in MCP Registry, skipping..."
          else
            echo "❌ Failed to publish to MCP Registry"
            exit 1
          fi
